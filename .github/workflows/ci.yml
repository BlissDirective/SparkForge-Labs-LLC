# ════════════════════════════════════════════════════
# SparkForge CI
# Final-Audit 04-15-2026 Phase 1 Task 10
#
# Unified pipeline covering:
#   - DEPLOY-CRIT-001 (Gitleaks secret scan)
#   - DB-CRIT-002 (verify_rls.sql gate against fresh Postgres)
#   - General quality gates: TypeScript, unit tests, production build
#
# Runs on every pull request and on pushes to main.
# Jobs run in parallel where possible.
# ════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'claude/**' # audit branches

# Cancel superseded runs for the same branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Secret scanning (DEPLOY-CRIT-001) ─────────────────────────────
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history needed for gitleaks to scan every commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks detect --config .gitleaks.toml --verbose --redact --exit-code 1

  # ─── TypeScript + unit tests + production build ─────────────────────
  typecheck-test-build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: API auth audit (AUTH-HIGH-002 defense-in-depth)
        run: bash scripts/audit-api-auth.sh

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        env:
          # Placeholder env so Next's static generation doesn't fail on CI.
          # The build process doesn't talk to Supabase — these are only
          # read at runtime which never happens in `next build`.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
        run: npm run build

  # ─── Row-level security verification (DB-CRIT-002) ─────────────────
  rls-verify:
    name: RLS verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparkforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sparkforge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sparkforge_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; then
              echo "Postgres is up"; exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Install Supabase auth stubs
        run: psql -v ON_ERROR_STOP=1 -f sql/ci-auth-stubs.sql

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          files=(
            sql/001_schema.sql
            sql/001a_indexes.sql
            sql/002_rls.sql
            sql/003_functions.sql
            sql/schema-stage8.sql
            sql/schema-stage8-patch-admin-trials.sql
            sql/schema-stage8-patch-children-archive.sql
            sql/schema-stage9.sql
            sql/schema-fll-content-types.sql
            sql/008_subscription_events_processed.sql
            sql/009_subscription_events_split.sql
            sql/010_rls_belt_and_suspenders.sql
            sql/011_parents_email_verified_at.sql
            sql/012_xp_daily_cap.sql
            sql/013_content_admin_tighten.sql
            sql/014_audit_log.sql
            sql/015_pg_cron_daily_resets.sql
            sql/016_perf_indexes.sql
            sql/017_subscription_events_fk_cleanup.sql
            sql/018_content_slug_enforce.sql
            sql/022_auth_events.sql
            sql/023_mfa_backup_codes.sql
            sql/024_realtime_progress.sql
            sql/025_dunning.sql
          )
          for f in "${files[@]}"; do
            echo "═══ applying $f ═══"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run RLS verification gate
        run: psql -v ON_ERROR_STOP=1 -f sql/verify_rls.sql

  # ─── Playwright smoke (DEPLOY-ENH-001 Max) ─────────────────────────
  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build (prod)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
        run: npm run build
      - name: Start server + run smoke spec
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: |
          npm start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          # Poll the health endpoint until it responds.
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          npx playwright test tests/e2e/health.spec.ts tests/e2e/a11y-sidebar.spec.ts

  # ─── Lighthouse budget (DEPLOY-ENH-001 Max) ─────────────────────────
  lighthouse:
    name: Lighthouse CI
    needs: typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Build (prod)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
        run: npm run build
      - name: Run Lighthouse CI against local server
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: |
          npm start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          lhci autorun --config=.lighthouserc.json || true
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  # ─── Bundle-size regression gate (DEPLOY-ENH-001 Max) ───────────────
  bundle-size:
    name: Bundle-size regression
    needs: typecheck-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build + collect bundle stats
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
        run: npm run build
      - name: Compute totals
        id: sizes
        run: node scripts/bundle-size.mjs >> $GITHUB_OUTPUT
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Bundle-size report',
              '',
              `- First Load JS (shared): ${{ steps.sizes.outputs.first_load_kb }} kB`,
              `- Middleware: ${{ steps.sizes.outputs.middleware_kb }} kB`,
              `- Static routes: ${{ steps.sizes.outputs.static_count }}`,
              `- Dynamic routes: ${{ steps.sizes.outputs.dynamic_count }}`,
              '',
              'Budget gates:',
              `- First Load JS ≤ 875 kB: **${{ steps.sizes.outputs.first_load_pass }}**`,
              `- Middleware ≤ 360 kB: **${{ steps.sizes.outputs.middleware_pass }}**`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Bundle-size report';
            const prior = comments.find(c => c.body && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Enforce budgets
        run: |
          if [ "${{ steps.sizes.outputs.first_load_pass }}" != "yes" ]; then
            echo "First Load JS exceeds 875 kB budget — raise in scripts/bundle-size.mjs if intentional"; exit 1
          fi
          if [ "${{ steps.sizes.outputs.middleware_pass }}" != "yes" ]; then
            echo "Middleware exceeds 360 kB budget — raise in scripts/bundle-size.mjs if intentional"; exit 1
          fi
