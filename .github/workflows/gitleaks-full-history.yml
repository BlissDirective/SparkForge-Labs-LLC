# ════════════════════════════════════════════════════
# Weekly full-history secret scan
#
# The per-PR gitleaks job in ci.yml scans only the commits a PR adds
# (range scan, since PR #166) so it does not re-fail every PR on blobs
# already on the integration branch. This scheduled job keeps the
# full-history guarantee: anything that ever landed is rescanned weekly.
# ════════════════════════════════════════════════════

name: Gitleaks full history

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    name: Scan entire history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --config .gitleaks.toml --verbose --redact --exit-code 1
